<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canned Responses — Glass</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 55%, #f093fb 100%);
      background-attachment: fixed;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      background: rgba(0,0,0,0.22);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.15);
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 12px;
    }
    .header-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .header h1 { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; }
    .badge {
      font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px;
      background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.6); white-space: nowrap;
    }
    .badge.live { background: rgba(134,239,172,0.2); color: #86efac; }
    .search-wrap {
      flex: 1; max-width: 380px;
      display: flex; align-items: center;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px; overflow: hidden;
      backdrop-filter: blur(8px);
    }
    .search-wrap:focus-within { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.35); }
    .search-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: #fff; font-size: 13px; padding: 8px 12px; font-family: inherit;
    }
    .search-input::placeholder { color: rgba(255,255,255,0.4); }
    .btn-add {
      background: rgba(255,255,255,0.22); color: #fff; border: 1px solid rgba(255,255,255,0.3);
      border-radius: 7px; padding: 7px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
      white-space: nowrap; transition: background 0.15s; flex-shrink: 0; backdrop-filter: blur(8px);
    }
    .btn-add:hover { background: rgba(255,255,255,0.32); }

    /* ── Board ── */
    .board { flex: 1; display: flex; gap: 0; overflow: hidden; }

    /* ── Column ── */
    .column {
      flex: 1; min-width: 0; display: flex; flex-direction: column;
      border-right: 1px solid rgba(255,255,255,0.12);
    }
    .column:last-child { border-right: none; }

    .col-header {
      padding: 12px 14px 10px;
      font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; border-bottom: 2px solid transparent;
      backdrop-filter: blur(12px);
    }
    .col-count {
      font-size: 10px; font-weight: 600; padding: 2px 7px;
      border-radius: 10px; background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.8);
    }

    .col-gf .col-header { color: #fed7aa; border-color: rgba(251,146,60,0.7); background: rgba(251,146,60,0.15); }
    .col-tf .col-header { color: #bbf7d0; border-color: rgba(74,222,128,0.7); background: rgba(74,222,128,0.12); }
    .col-ge .col-header { color: #bfdbfe; border-color: rgba(96,165,250,0.7); background: rgba(96,165,250,0.12); }
    .col-te .col-header { color: #e9d5ff; border-color: rgba(192,132,252,0.7); background: rgba(192,132,252,0.12); }

    .col-body {
      flex: 1; overflow-y: auto; padding: 8px;
      display: flex; flex-direction: column; gap: 6px;
      transition: background 0.15s;
      background: rgba(0,0,0,0.05);
    }
    .col-body.drag-over { background: rgba(255,255,255,0.12); }

    /* ── Card ── */
    .card {
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.28);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 11px;
      padding: 10px 12px; cursor: pointer; user-select: none;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, opacity 0.12s;
    }
    .card:hover {
      background: rgba(255,255,255,0.24);
      border-color: rgba(255,255,255,0.45);
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    .card.dragging { opacity: 0.3; }
    .card.drag-ghost { box-shadow: 0 12px 32px rgba(0,0,0,0.25); border-color: rgba(255,255,255,0.6); }

    .card-shortcut {
      font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.95);
      margin-bottom: 4px; direction: auto; display: flex; align-items: center; gap: 5px;
    }
    .card-shortcut .hash { color: rgba(255,255,255,0.35); }
    .card-preview {
      font-size: 11.5px; color: rgba(255,255,255,0.6); direction: auto;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4;
    }
    .card-actions { display: none; }

    /* ── Empty col ── */
    .col-empty {
      border: 1.5px dashed rgba(255,255,255,0.25); border-radius: 10px; padding: 20px;
      text-align: center; font-size: 12px; color: rgba(255,255,255,0.3); margin: 4px;
      pointer-events: none;
    }

    /* ── Modals ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.18s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: rgba(255,255,255,0.97); color: #1e293b;
      border-radius: 16px; width: 600px; max-width: 92vw;
      max-height: 88vh; display: flex; flex-direction: column;
      box-shadow: 0 32px 80px rgba(0,0,0,0.35);
      transform: translateY(12px) scale(0.98); transition: transform 0.2s;
    }
    .overlay.open .modal { transform: translateY(0) scale(1); }
    .modal-head {
      padding: 18px 20px 14px; border-bottom: 1px solid #f1f5f9;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0;
    }
    .modal-title { font-size: 15px; font-weight: 700; color: #1e293b; direction: auto; }
    .modal-head-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .btn-copy {
      background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
      border-radius: 7px; padding: 7px 15px; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: opacity 0.15s;
    }
    .btn-copy:hover { opacity: 0.88; }
    .btn-copy.copied { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .btn-edit {
      background: #f1f5f9; color: #475569; border: none; border-radius: 7px;
      padding: 7px 13px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .btn-edit:hover { background: #e2e8f0; color: #1e293b; }
    .btn-del-preview {
      background: #fff0f0; color: #dc2626; border: none; border-radius: 7px;
      padding: 7px 13px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .btn-del-preview:hover { background: #fee2e2; }
    .btn-close {
      background: #f1f5f9; border: none; border-radius: 6px; width: 28px; height: 28px;
      font-size: 14px; cursor: pointer; color: #64748b;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-close:hover { background: #e2e8f0; }
    .modal-col-tabs { padding: 10px 20px 0; display: flex; gap: 6px; flex-shrink: 0; }
    .col-tab {
      padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; border: 1.5px solid #e2e8f0; background: transparent; color: #94a3b8;
      transition: all 0.12s;
    }
    .col-tab.gf.active { background: #fff7ed; border-color: #f97316; color: #ea580c; }
    .col-tab.tf.active { background: #f0fdf4; border-color: #16a34a; color: #15803d; }
    .col-tab.ge.active { background: #eff6ff; border-color: #2563eb; color: #2563eb; }
    .col-tab.te.active { background: #fdf4ff; border-color: #9333ea; color: #7e22ce; }
    .modal-body { flex: 1; overflow-y: auto; padding: 14px 20px 20px; }
    .preview-text {
      background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 10px;
      padding: 16px 18px; font-size: 13.5px; line-height: 1.9; color: #334155;
      white-space: pre-wrap; min-height: 200px;
    }
    .edit-textarea {
      width: 100%; background: #fff; border: 1.5px solid #764ba2;
      border-radius: 10px; padding: 16px 18px; font-size: 13.5px; line-height: 1.9;
      color: #1e293b; font-family: inherit; resize: none; outline: none;
      min-height: 200px; box-shadow: 0 0 0 3px rgba(118,75,162,0.12);
    }
    .edit-shortcut-wrap { padding: 10px 20px 0; flex-shrink: 0; }
    .edit-shortcut-input {
      width: 100%; background: #fff; border: 1.5px solid #764ba2; border-radius: 8px;
      padding: 8px 12px; font-size: 14px; font-weight: 700; color: #1e293b;
      font-family: inherit; outline: none; direction: auto;
      box-shadow: 0 0 0 3px rgba(118,75,162,0.12);
    }
    .btn-save-inline {
      background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
      border-radius: 7px; padding: 7px 15px; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: opacity 0.15s;
    }
    .btn-save-inline:hover { opacity: 0.88; }
    .btn-save-inline:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-cancel-inline {
      background: #f1f5f9; color: #64748b; border: none; border-radius: 7px;
      padding: 7px 13px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .btn-cancel-inline:hover { background: #e2e8f0; }

    /* ── Edit/Add modal ── */
    .edit-modal { width: 560px; }
    .edit-modal .modal-head { padding-bottom: 16px; }
    .form-group { margin-bottom: 13px; }
    .form-group label {
      display: block; font-size: 10px; font-weight: 800; color: #94a3b8;
      margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.07em;
    }
    .form-group input, .form-group textarea {
      width: 100%; background: #f8fafc; border: 1.5px solid #e2e8f0;
      border-radius: 8px; padding: 9px 12px; font-size: 13px; color: #1e293b;
      outline: none; font-family: inherit; resize: vertical; transition: border-color 0.12s;
    }
    .form-group input:focus, .form-group textarea:focus {
      border-color: #764ba2; background: #fff; box-shadow: 0 0 0 3px rgba(118,75,162,0.1);
    }
    .form-group textarea { height: 80px; line-height: 1.6; }
    .form-group textarea.rtl { direction: rtl; text-align: right; }
    .modal-foot {
      padding: 14px 20px; border-top: 1px solid #f1f5f9;
      display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0;
    }
    .btn-cancel {
      background: #f1f5f9; color: #64748b; border: none; border-radius: 7px;
      padding: 8px 16px; font-size: 13px; font-weight: 500; cursor: pointer;
    }
    .btn-cancel:hover { background: #e2e8f0; }
    .btn-save {
      background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
      border-radius: 7px; padding: 8px 20px; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .btn-save:hover { opacity: 0.88; }
    .btn-save:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Confirm dialog ── */
    .confirm-box {
      background: rgba(255,255,255,0.97); border-radius: 14px; padding: 22px 24px; width: 300px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.3);
      transform: scale(0.95); transition: transform 0.15s;
    }
    .overlay.open .confirm-box { transform: scale(1); }
    .confirm-box p { font-size: 14px; font-weight: 600; color: #1e293b; margin-bottom: 4px; }
    .confirm-box small { font-size: 12px; color: #94a3b8; }
    .confirm-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
    .btn-del { background: #dc2626; color: #fff; border: none; border-radius: 7px; padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn-del:hover { background: #b91c1c; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 18px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: rgba(0,0,0,0.75); backdrop-filter: blur(12px); color: #fff; padding: 9px 18px;
      border-radius: 9px; font-size: 13px; font-weight: 600;
      transition: transform 0.22s; z-index: 500; pointer-events: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.12);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <h1>📋 Canned Responses</h1>
    <span class="badge" id="badge">Loading...</span>
  </div>
  <div class="search-wrap">
    <input class="search-input" id="searchInput" type="text" placeholder="Search by shortcut..." oninput="renderBoard()" autocomplete="off" spellcheck="false" />
  </div>
  <button class="btn-add" onclick="openEditModal()">+ New</button>
</div>

<!-- Board -->
<div class="board">
  <div class="column col-gf" id="col-generalFarsi">
    <div class="col-header">
      General Farsi <span class="col-count" id="cnt-generalFarsi">0</span>
    </div>
    <div class="col-body" id="body-generalFarsi"
      ondragover="onDragOver(event,'generalFarsi')"
      ondragleave="onDragLeave(event,'generalFarsi')"
      ondrop="onDrop(event,'generalFarsi')">
    </div>
  </div>
  <div class="column col-tf" id="col-technicalFarsi">
    <div class="col-header">
      Technical Farsi <span class="col-count" id="cnt-technicalFarsi">0</span>
    </div>
    <div class="col-body" id="body-technicalFarsi"
      ondragover="onDragOver(event,'technicalFarsi')"
      ondragleave="onDragLeave(event,'technicalFarsi')"
      ondrop="onDrop(event,'technicalFarsi')">
    </div>
  </div>
  <div class="column col-ge" id="col-generalEnglish">
    <div class="col-header">
      General English <span class="col-count" id="cnt-generalEnglish">0</span>
    </div>
    <div class="col-body" id="body-generalEnglish"
      ondragover="onDragOver(event,'generalEnglish')"
      ondragleave="onDragLeave(event,'generalEnglish')"
      ondrop="onDrop(event,'generalEnglish')">
    </div>
  </div>
  <div class="column col-te" id="col-technicalEnglish">
    <div class="col-header">
      Technical English <span class="col-count" id="cnt-technicalEnglish">0</span>
    </div>
    <div class="col-body" id="body-technicalEnglish"
      ondragover="onDragOver(event,'technicalEnglish')"
      ondragleave="onDragLeave(event,'technicalEnglish')"
      ondrop="onDrop(event,'technicalEnglish')">
    </div>
  </div>
</div>

<!-- Preview overlay -->
<div class="overlay" id="previewOverlay" onclick="closePreviewOnBg(event)">
  <div class="modal" id="previewModal">
    <div class="modal-head">
      <div id="previewTitleWrap" class="modal-title" style="flex:1;min-width:0"></div>
      <div class="modal-head-right" id="previewActions"></div>
    </div>
    <div id="previewShortcutWrap"></div>
    <div class="modal-col-tabs" id="previewTabs"></div>
    <div class="modal-body" id="previewBody"></div>
  </div>
</div>

<!-- Edit/Add overlay -->
<div class="overlay" id="editOverlay" onclick="closeEditOnBg(event)">
  <div class="modal edit-modal">
    <div class="modal-head">
      <div class="modal-title" id="editTitle">New Canned Response</div>
      <button class="btn-close" onclick="closeEditModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Shortcut</label>
        <input type="text" id="eShortcut" style="direction:auto" placeholder="e.g. slippage, اسلیپیج" />
      </div>
      <div class="form-group">
        <label>🟡 General Farsi</label>
        <textarea id="eGenFarsi" class="rtl" placeholder="با سالم و احترام،&#10;..."></textarea>
      </div>
      <div class="form-group">
        <label>🟢 Technical Farsi</label>
        <textarea id="eTechFarsi" class="rtl" placeholder="با سالم و احترام،&#10;..."></textarea>
      </div>
      <div class="form-group">
        <label>🔵 General English</label>
        <textarea id="eGenEng" placeholder="Dear Client,&#10;..."></textarea>
      </div>
      <div class="form-group">
        <label>🟣 Technical English</label>
        <textarea id="eTechEng" placeholder="Dear Client,&#10;..."></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
      <button class="btn-save" id="btnSave" onclick="saveEdit()">Save to Sheet</button>
    </div>
  </div>
</div>

<!-- Delete confirm overlay -->
<div class="overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p>Delete this response?</p>
    <small id="confirmLabel"></small>
    <div class="confirm-actions">
      <button class="btn-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="btn-del" onclick="doDelete()">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzspslW9soKbvtN_D9jNoz_7FWWYwppENFRTIQCCOnpQCjUYcHaurRytiPQ0VtVtSEJBA/exec';

  const COLS = [
    { key: 'generalFarsi',    label: 'Gen. Farsi',    tabCls: 'gf' },
    { key: 'technicalFarsi',  label: 'Tech. Farsi',   tabCls: 'tf' },
    { key: 'generalEnglish',  label: 'Gen. English',  tabCls: 'ge' },
    { key: 'technicalEnglish',label: 'Tech. English', tabCls: 'te' },
  ];

  let allData    = [];
  let editingIdx = -1;
  let deleteIdx  = -1;
  let dragItemIdx = -1;
  let dragFromCol = '';
  let previewIdx = -1;
  let previewCol = '';

  async function loadData() {
    try {
      const res = await fetch(SCRIPT_URL + '?action=getAll');
      allData = await res.json();
      const b = document.getElementById('badge');
      b.textContent = '🟢 Live · ' + allData.length;
      b.className = 'badge live';
    } catch {
      showToast('Sheet unavailable');
    }
    renderBoard();
  }

  function renderBoard() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const filtered = q
      ? allData.filter(r => (r.shortcut || '').toLowerCase().includes(q) ||
          COLS.some(c => (r[c.key] || '').toLowerCase().includes(q)))
      : allData;

    for (const col of COLS) {
      const items = filtered.filter(r => (r[col.key] || '').trim());
      const body  = document.getElementById('body-' + col.key);
      const cnt   = document.getElementById('cnt-' + col.key);
      cnt.textContent = items.length;
      if (!items.length) {
        body.innerHTML = '<div class="col-empty">Drop here</div>';
        continue;
      }
      body.innerHTML = items.map(item => {
        const idx     = allData.indexOf(item);
        const label   = item.shortcut || firstLine(item[col.key]);
        const preview = firstLine(item[col.key]);
        return `<div class="card"
          draggable="true"
          ondragstart="onDragStart(event,${idx},'${col.key}')"
          ondragend="onDragEnd(event)"
          onclick="openPreview(${idx},'${col.key}')">
          <div class="card-shortcut"><span class="hash">#</span>${esc(label)}</div>
          <div class="card-preview">${esc(preview)}</div>
        </div>`;
      }).join('');
    }
  }

  function firstLine(text) {
    if (!text) return '';
    return (text.split('\n').find(l => l.trim()) || '').slice(0, 60);
  }
  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function onDragStart(e, idx, col) {
    dragItemIdx = idx; dragFromCol = col;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => e.target.classList.add('dragging'), 0);
  }
  function onDragEnd(e) {
    e.target.classList.remove('dragging');
    document.querySelectorAll('.col-body').forEach(b => b.classList.remove('drag-over'));
  }
  function onDragOver(e, col) {
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    document.getElementById('body-' + col).classList.add('drag-over');
  }
  function onDragLeave(e, col) {
    document.getElementById('body-' + col).classList.remove('drag-over');
  }
  async function onDrop(e, toCol) {
    e.preventDefault();
    document.getElementById('body-' + toCol).classList.remove('drag-over');
    if (dragItemIdx < 0 || dragFromCol === toCol) { dragItemIdx = -1; dragFromCol = ''; return; }
    const item = allData[dragItemIdx];
    const content = item[dragFromCol];
    item[toCol] = content; item[dragFromCol] = '';
    dragItemIdx = -1; dragFromCol = '';
    renderBoard(); showToast('Moved ✓');
    if (item._rowIndex) {
      try {
        await fetch(SCRIPT_URL + '?action=update&rowIndex=' + item._rowIndex +
          '&shortcut=' + encodeURIComponent(item.shortcut || '') +
          '&generalFarsi=' + encodeURIComponent(item.generalFarsi || '') +
          '&technicalFarsi=' + encodeURIComponent(item.technicalFarsi || '') +
          '&generalEnglish=' + encodeURIComponent(item.generalEnglish || '') +
          '&technicalEnglish=' + encodeURIComponent(item.technicalEnglish || ''));
      } catch { showToast('Sheet sync failed'); }
    }
  }

  let previewEditing = false;

  function openPreview(idx, col) {
    previewIdx = idx; previewCol = col; previewEditing = false;
    renderPreviewModal();
    document.getElementById('previewOverlay').classList.add('open');
  }

  function renderPreviewModal() {
    const item = allData[previewIdx];
    const isRtl = previewCol.includes('Farsi');

    if (previewEditing) {
      document.getElementById('previewTitleWrap').innerHTML =
        `<input class="edit-shortcut-input" id="inlineShortcut" value="${esc(item.shortcut || '')}" placeholder="Shortcut" />`;
    } else {
      document.getElementById('previewTitleWrap').textContent = item.shortcut || firstLine(item[previewCol]);
    }

    if (previewEditing) {
      document.getElementById('previewActions').innerHTML =
        `<button class="btn-save-inline" id="btnInlineSave" onclick="saveInline()">Save</button>
         <button class="btn-cancel-inline" onclick="cancelInline()">Cancel</button>
         <button class="btn-close" onclick="closePreview()">✕</button>`;
    } else {
      document.getElementById('previewActions').innerHTML =
        `<button class="btn-copy" id="copyBtn" onclick="copyPreview()">Copy</button>
         <button class="btn-edit" onclick="enterInlineEdit()">Edit</button>
         <button class="btn-del-preview" onclick="const _i=previewIdx;closePreview();askDelete(_i)">Delete</button>
         <button class="btn-close" onclick="closePreview()">✕</button>`;
    }

    const tabCols = previewEditing ? COLS : COLS.filter(c => (item[c.key] || '').trim());
    document.getElementById('previewTabs').innerHTML = tabCols.map(c =>
      `<button class="col-tab ${c.tabCls} ${previewCol === c.key ? 'active' : ''}"
        onclick="switchTab('${c.key}')">${c.label}</button>`
    ).join('');

    const text = item[previewCol] || '';
    if (previewEditing) {
      document.getElementById('previewBody').innerHTML =
        `<textarea class="edit-textarea" id="inlineTextarea"
          style="direction:${isRtl?'rtl':'ltr'};text-align:${isRtl?'right':'left'}"
        >${esc(text)}</textarea>`;
      setTimeout(() => {
        const ta = document.getElementById('inlineTextarea');
        if (ta) { ta.style.height = 'auto'; ta.style.height = Math.max(200, ta.scrollHeight) + 'px'; }
      }, 0);
    } else {
      document.getElementById('previewBody').innerHTML =
        `<div class="preview-text"
          style="direction:${isRtl?'rtl':'ltr'};text-align:${isRtl?'right':'left'}"
        >${esc(text)}</div>`;
    }
  }

  function switchTab(col) {
    if (previewEditing) {
      const ta = document.getElementById('inlineTextarea');
      if (ta) allData[previewIdx][previewCol] = ta.value;
    }
    previewCol = col; renderPreviewModal();
    if (previewEditing) setTimeout(() => { const ta = document.getElementById('inlineTextarea'); if (ta) ta.focus(); }, 50);
  }
  function enterInlineEdit() {
    previewEditing = true; renderPreviewModal();
    setTimeout(() => { const ta = document.getElementById('inlineTextarea'); if (ta) ta.focus(); }, 50);
  }
  function cancelInline() { previewEditing = false; renderPreviewModal(); }

  async function saveInline() {
    const btn = document.getElementById('btnInlineSave');
    if (btn) btn.disabled = true;
    const item = allData[previewIdx];
    const sc = document.getElementById('inlineShortcut');
    if (sc) item.shortcut = sc.value.trim().replace(/^#/, '');
    const ta = document.getElementById('inlineTextarea');
    if (ta) item[previewCol] = ta.value;
    previewEditing = false; renderPreviewModal(); renderBoard(); showToast('Saved ✓');
    if (item._rowIndex) {
      try {
        await fetch(SCRIPT_URL + '?action=update&rowIndex=' + item._rowIndex +
          '&shortcut=' + encodeURIComponent(item.shortcut || '') +
          '&generalFarsi=' + encodeURIComponent(item.generalFarsi || '') +
          '&technicalFarsi=' + encodeURIComponent(item.technicalFarsi || '') +
          '&generalEnglish=' + encodeURIComponent(item.generalEnglish || '') +
          '&technicalEnglish=' + encodeURIComponent(item.technicalEnglish || ''));
      } catch { showToast('Sheet sync failed'); }
    }
  }

  function copyPreview() {
    const text = allData[previewIdx]?.[previewCol] || '';
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!'; btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
    });
  }
  function closePreview() {
    document.getElementById('previewOverlay').classList.remove('open');
    previewIdx = -1; previewEditing = false;
  }
  function closePreviewOnBg(e) {
    if (e.target.id === 'previewOverlay' && !previewEditing) closePreview();
  }

  function openEditModal(idx = -1) {
    editingIdx = idx;
    document.getElementById('editTitle').textContent = idx >= 0 ? 'Edit Response' : 'New Canned Response';
    document.getElementById('btnSave').textContent   = idx >= 0 ? 'Update' : 'Save to Sheet';
    if (idx >= 0) {
      const item = allData[idx];
      document.getElementById('eShortcut').value  = item.shortcut || '';
      document.getElementById('eGenFarsi').value  = item.generalFarsi || '';
      document.getElementById('eTechFarsi').value = item.technicalFarsi || '';
      document.getElementById('eGenEng').value    = item.generalEnglish || '';
      document.getElementById('eTechEng').value   = item.technicalEnglish || '';
    } else {
      ['eShortcut','eGenFarsi','eTechFarsi','eGenEng','eTechEng'].forEach(id => document.getElementById(id).value = '');
    }
    document.getElementById('btnSave').disabled = false;
    document.getElementById('editOverlay').classList.add('open');
    setTimeout(() => document.getElementById('eShortcut').focus(), 80);
  }
  function closeEditModal() { document.getElementById('editOverlay').classList.remove('open'); editingIdx = -1; }
  function closeEditOnBg(e) { if (e.target.id === 'editOverlay') closeEditModal(); }

  async function saveEdit() {
    const item = {
      shortcut:         document.getElementById('eShortcut').value.trim().replace(/^#/,''),
      generalFarsi:     document.getElementById('eGenFarsi').value.trim(),
      technicalFarsi:   document.getElementById('eTechFarsi').value.trim(),
      generalEnglish:   document.getElementById('eGenEng').value.trim(),
      technicalEnglish: document.getElementById('eTechEng').value.trim(),
    };
    if (!item.generalFarsi && !item.technicalFarsi && !item.generalEnglish && !item.technicalEnglish) {
      showToast('Add at least one response text'); return;
    }
    const btn = document.getElementById('btnSave');
    btn.disabled = true;
    if (editingIdx >= 0) {
      item._rowIndex = allData[editingIdx]._rowIndex;
      allData[editingIdx] = item; showToast('Updated ✓');
      if (item._rowIndex) {
        try {
          await fetch(SCRIPT_URL + '?action=update&rowIndex=' + item._rowIndex +
            '&shortcut=' + encodeURIComponent(item.shortcut) +
            '&generalFarsi=' + encodeURIComponent(item.generalFarsi) +
            '&technicalFarsi=' + encodeURIComponent(item.technicalFarsi) +
            '&generalEnglish=' + encodeURIComponent(item.generalEnglish) +
            '&technicalEnglish=' + encodeURIComponent(item.technicalEnglish));
        } catch {}
      }
    } else {
      allData.push(item); showToast('Saved ✓');
      try {
        await fetch(SCRIPT_URL + '?action=add' +
          '&shortcut=' + encodeURIComponent(item.shortcut) +
          '&generalFarsi=' + encodeURIComponent(item.generalFarsi) +
          '&technicalFarsi=' + encodeURIComponent(item.technicalFarsi) +
          '&generalEnglish=' + encodeURIComponent(item.generalEnglish) +
          '&technicalEnglish=' + encodeURIComponent(item.technicalEnglish));
      } catch {}
    }
    closeEditModal(); renderBoard();
  }

  function askDelete(idx) {
    deleteIdx = idx;
    document.getElementById('confirmLabel').textContent = allData[idx].shortcut || '(no shortcut)';
    document.getElementById('confirmOverlay').classList.add('open');
  }
  function closeConfirm() { document.getElementById('confirmOverlay').classList.remove('open'); deleteIdx = -1; }
  async function doDelete() {
    if (deleteIdx < 0) return;
    const item = allData[deleteIdx];
    allData.splice(deleteIdx, 1);
    closeConfirm(); renderBoard(); showToast('Deleted');
    if (item._rowIndex) {
      try { await fetch(SCRIPT_URL + '?action=delete&rowIndex=' + item._rowIndex); } catch {}
    }
  }

  let toastTimer;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closePreview(); closeEditModal(); closeConfirm(); }
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      document.getElementById('searchInput').focus();
    }
  });

  loadData();
</script>
</body>
</html>
